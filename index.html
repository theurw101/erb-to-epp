<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puppet ERB to EPP Converter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PrismJS/prism-themes@master/themes/prism-vsc-dark-plus.css">
  <link rel="stylesheet" href="./themes/styles.css">
</head>
<body class="body">

  <h1 class="title">ERB to EPP Converter</h1>
  <p>Convert Puppet templates locally in the browser.</p>

  <div class="container">
    <div>
      <b><label for="erb-input">Source .erb Template:</label></b>
      <textarea id="erb-input" class="prism-live language-erb" placeholder="<% if @example %>...<% end %>"></textarea>
    </div>

    <div>
      <div class="output-header">
        <b><label for="epp-output">Generated .epp Output:</label></b>
      </div>
      <textarea id="epp-output" class="prism-live language-puppet" readonly placeholder="Output will appear here..."></textarea>
      <button id="copy-btn" class="copy-button" type="button">Copy</button>
    </div>
  </div>

  <!-- Button -->
  <div style="margin-top: 10px;">
    <button id="convert-btn" class="button" disabled>Loading Engine...</button>
    <div id="error-message" class="error" style="display: none;"></div>
  </div>

  <footer class="footer">
    <p class="footer-tagline">Made with Rust, JavaScript &amp; WebAssembly</p>
    <p>
      <a href="https://github.com/theurw101/erb-to-epp" target="_blank" rel="noopener noreferrer">
        View on GitHub
      </a>
      &middot;
      <span id="app-version">Checking for version…</span>
    </p>
  </footer>

  <!-- WebAssembly Script -->
  <script type="module">
    // Update "erb_to_epp.js" to match your exact generated file name
    import init, { convert_erb_to_epp } from './pkg/erb_to_epp.js';

    const input  = document.getElementById('erb-input');
    const output = document.getElementById('epp-output');
    const error  = document.getElementById('error-message');
    const button = document.getElementById('convert-btn');

    async function run() {
      try {
        await init(); // Load the Wasm file
        button.innerText = 'Convert';
        button.disabled = false;

        button.addEventListener('click', () => {
          error.style.display = 'none';
          output.value = '';

          if (!input.value.trim()) {
            error.innerText = "Input is empty";
            error.style.display = 'block';
            return;
          }

          try {
            // Run your Rust code!
            output.value = convert_erb_to_epp(input.value);
            output.dispatchEvent(new Event('input'));
          } catch (err) {
            error.innerText = err;
            error.style.display = 'block';
          }
        });
      } catch (err) {
        error.innerText = "Failed to load WebAssembly.";
        error.style.display = 'block';
        console.error(err);
      }
    }

    run();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-erb.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-puppet.min.js"></script>

  <!--prism live for textboxes-->
  <script type="module" src="https://cdn.jsdelivr.net/gh/PrismJS/live@master/src/prism-live.mjs"></script>

  <!--copy to clipboard script-->
  <script>
    const copyBtn = document.getElementById('copy-btn');
    const outputBox = document.getElementById('epp-output');

    copyBtn.addEventListener('click', async () => {
      if (!outputBox.value.trim()) return;

      try {
        await navigator.clipboard.writeText(outputBox.value);
        copyBtn.textContent = 'Copied!';
      } catch (err) {
        copyBtn.textContent = 'Failed to copy';
        console.error(err);
      }

      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  </script>

  <!--get Version from gh for footer-->
  <script type="module">
    const versionEl = document.getElementById('app-version');
    fetch('https://api.github.com/repos/theurw101/erb-to-epp/releases/latest')
      .then(res => {
        if (!res.ok) throw new Error('no release found');
        return res.json();
      })
      .then(data => {
        versionEl.textContent = `Version: ${data.tag_name}`;
      })
      .catch(() => {
        versionEl.textContent = 'No release published yet';
      });
  </script>
</body>
</html>
